{% extends "base.html" %}

{% block title %}Writings - Bengü's Blog{% endblock %}

{% block content %}
  <h2>My Writings</h2>

  <a href="{{ url_for('add_writing', pass='bengu123') }}" class="add-link">
    + Add New Writing
  </a>

  <div class="writings-list">
    {% for writing in writings %}
      <div class="writing-item">
        <h3>{{ writing[1] }}</h3>
        <p>{{ writing[2] }}</p>
        <small>{{ writing[3] }}</small>
      </div>
    {% else %}
      <p>No writings yet.</p>
    {% endfor %}
  </div>
{% endblock %}
