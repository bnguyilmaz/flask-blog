{% extends "base.html" %}

{% block title %}Login - Bengü's Blog{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm p-8 bg-[#2a2724] border border-[#3e3a36] rounded-2xl shadow-md">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-serif font-semibold text-[#d9cbb5] mb-2">🔒 Login</h2>
      <p class="text-sm italic text-[#b8a58d]">Welcome back to your thoughts.</p>
    </div>

    <form method="POST" class="space-y-6">
      <div>
        <label class="block mb-2 text-[#d9cbb5] font-medium">Username</label>
        <input
          type="text"
          name="username"
          class="input input-bordered w-full bg-[#1d1b18] border-[#4a443d] text-[#e9e4d8] focus:border-[#a88a67] focus:outline-none"
          required
        >
      </div>

      <div>
        <label class="block mb-2 text-[#d9cbb5] font-medium">Password</label>
        <input
          type="password"
          name="password"
          class="input input-bordered w-full bg-[#1d1b18] border-[#4a443d] text-[#e9e4d8] focus:border-[#a88a67] focus:outline-none"
          required
        >
      </div>

      <button
        type="submit"
        class="btn w-full bg-[#a88a67] border-none text-white hover:bg-[#8b7153] transition-all">
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
